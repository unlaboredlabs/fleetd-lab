name: CI
permissions:
  contents: read

on:
  pull_request:
    branches: ["bench/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p taplo -p taplo-common -p taplo-cli -p lsp-async-stub -p taplo-lsp
      - name: Build the toml-test decoder
        run: cargo build --bin taplo --no-default-features --features "rustls-tls,toml-test"
      - name: Check formatting regression
        run: ./target/debug/taplo fmt --check
      - name: Check if git index is clean
        run: git diff-index --quiet HEAD --
      - name: Retrieve toml-test
        run: |
          wget -q https://github.com/toml-lang/toml-test/releases/download/v2.1.0/toml-test-v2.1.0-linux-amd64.gz
          gunzip toml-test-v2.1.0-linux-amd64.gz
          chmod +x toml-test-v2.1.0-linux-amd64
      - name: Run toml-test
        run: ./toml-test-v2.1.0-linux-amd64 test -toml 1.1 -decoder "./target/debug/taplo toml-test"
