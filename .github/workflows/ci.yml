name: ci

on:
  pull_request:
    branches-ignore: ["noci/**"]
  push:
    branches: [main, "slot/*/main"]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: No FAIL file
        run: test ! -e FAIL
      - name: No pair file
        run: test ! -e lab/20261023130732/pair
